aid: espresso
name: Espresso
description: >-
  Espresso Systems builds the Espresso Network, a high-performance consensus and
  sequencing layer that gives rollups and institution-grade financial
  applications real-time settlement (~3 second finality) without sacrificing
  control, privacy, or connectivity to global onchain liquidity. The network is
  a permissionless delegated-proof-of-stake system (Mainnet 1.0, live) built on
  the HotShot BFT consensus protocol and the Tiramisu data-availability layer,
  confirming transactions for integrated Arbitrum Nitro/Orbit and OP Stack
  chains. Espresso nodes and query services expose a public, no-auth REST + WebSocket
  API (built on the Tide Disco framework) across modules for availability, node
  state, consensus status, catchup, explorer, events streaming, and transaction
  submission. The API is served on both the Ethereum-mainnet-anchored Mainnet and
  the Sepolia-anchored Decaf testnet, with content negotiation between JSON and
  binary and URL-path major versioning (v0 → v1).
