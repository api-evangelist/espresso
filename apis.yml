apis:
- name: Espresso Network Query Service API
  description: >-
    The public REST and WebSocket API served by Espresso query services and
    nodes (Tide Disco framework). Comprises independent modules — availability
    (Tiramisu DA blocks/headers/payloads/VID), node, status, catchup, state,
    explorer, hotshot-events streaming, and submit (post transactions to the
    public mempool) — each versioned via URL path (v0/v1) and negotiating JSON
    or binary via Content-Type/Accept. Read endpoints are unauthenticated; there
    is no "latest block" query — clients index by block height or hash.
  humanURL: https://docs.espressosys.com/network/developer/espresso-api
  baseURL: https://query.main.net.espresso.network/v1
